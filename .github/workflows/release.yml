name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  verify:
    name: Verify Typecheck, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact_pattern: 'apps/desktop/release/*.exe'
          - os: macos-latest
            platform: mac
            artifact_pattern: 'apps/desktop/release/*.dmg'
          - os: ubuntu-latest
            platform: linux
            artifact_pattern: 'apps/desktop/release/*.AppImage'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages & Electron app
        run: pnpm build
      - name: Package desktop installer
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --config electron-builder.yml --publish never
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error

  build-android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Setup Java 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages & mobile web bundle
        run: pnpm build
      - name: Sync Capacitor Android assets & plugins
        working-directory: apps/mobile
        run: pnpm exec cap sync android
      - name: Decode optional Android release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yourtutor-release.jks"
            echo "keystore_path=$RUNNER_TEMP/yourtutor-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret configured; building installable open-source signed APK."
          fi
      - name: Build Android Release APK via Gradle
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          fi
          VERSION_NAME="${RELEASE_TAG#v}"
          chmod +x ./gradlew
          ./gradlew assembleRelease -PversionName="$VERSION_NAME" --no-daemon
          mkdir -p "$RUNNER_TEMP/android-out"
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_SRC" "$RUNNER_TEMP/android-out/YourTutor-${VERSION_NAME}-android.apk"
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ runner.temp }}/android-out/*.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release (4 Platforms)
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all 4-platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          generate_release_notes: true
          files: artifacts/*
